<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resilient Activism check-in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#211C2E;--ink-soft:#4B4560;--cream:#FAF6EF;--paper:#FFFFFF;--hairline:#E4DFD3;--dusk:#5B5480;--amber:#E08A3C;--amber-deep:#B96A22;--sage:#6F9070;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--cream);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px 20px;}
  .card{width:100%;max-width:520px;background:var(--paper);border:1px solid var(--hairline);border-radius:20px;padding:28px 40px 36px;position:relative;overflow:hidden;}
  .lang{display:flex;justify-content:flex-end;gap:4px;margin-bottom:22px;}
  .lang button{width:auto;padding:6px 12px;font-size:13px;font-weight:600;border:1px solid var(--hairline);background:transparent;color:var(--ink-soft);border-radius:8px;}
  .lang button:hover{background:var(--cream);}
  .lang button[aria-pressed="true"]{background:var(--ink);color:var(--cream);border-color:var(--ink);}
  .arc{display:flex;gap:6px;margin-bottom:28px;}
  .arc span{flex:1;height:5px;border-radius:3px;background:var(--hairline);transition:background .25s ease;}
  .eyebrow{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--dusk);font-weight:600;margin:0 0 10px;}
  h1{font-family:'Fraunces',serif;font-weight:500;font-size:32px;line-height:1.15;margin:0 0 14px;}
  h1 em{font-style:italic;color:var(--amber-deep);}
  p.lede{font-size:15px;line-height:1.6;color:var(--ink-soft);margin:0 0 30px;}
  label{display:block;font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--ink-soft);margin-bottom:6px;}
  input[type=text]{width:100%;font-family:'Inter',sans-serif;font-size:15px;padding:11px 13px;border:1px solid var(--hairline);border-radius:10px;background:var(--cream);color:var(--ink);margin-bottom:22px;}
  input[type=text]:focus{outline:none;border-color:var(--dusk);}
  .meta-row{display:flex;gap:20px;margin-bottom:28px;padding:16px 18px;background:var(--cream);border-radius:12px;border:1px solid var(--hairline);}
  .meta-item{flex:1;}
  .meta-item .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--dusk);font-weight:600;margin-bottom:3px;}
  .meta-item .v{font-size:15px;font-weight:500;font-family:'Fraunces',serif;}
  #addBtn{width:100%;font-family:'Inter',sans-serif;font-size:15px;font-weight:600;padding:15px 20px;border:none;border-radius:11px;background:var(--ink);color:var(--cream);cursor:pointer;transition:transform .12s ease,background .2s ease;}
  #addBtn:hover{background:var(--amber-deep);}
  #addBtn:active{transform:scale(.98);}
  button:focus-visible{outline:2px solid var(--dusk);outline-offset:2px;}
  .status{margin-top:18px;font-size:13.5px;line-height:1.6;color:var(--sage);display:none;}
  .status.show{display:block;}
  .status .dates{color:var(--ink-soft);font-size:12.5px;margin-top:6px;}
  .foot{margin-top:26px;padding-top:20px;border-top:1px solid var(--hairline);font-size:12.5px;color:var(--dusk);line-height:1.5;}
  @media (max-width:480px){.card{padding:24px 22px 28px;}h1{font-size:27px;}}
</style>
</head>
<body>

<div class="card">
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="en">EN</button>
    <button type="button" data-lang="nl">NL</button>
    <button type="button" data-lang="de">DE</button>
  </div>

  <div class="arc" id="arc"></div>
  <p class="eyebrow" id="eyebrow"></p>
  <h1><span id="h1a"></span><br><em id="h1b"></em></h1>
  <p class="lede" id="lede"></p>

  <label for="title" id="titleLabel"></label>
  <input type="text" id="title" maxlength="80">

  <div class="meta-row">
    <div class="meta-item"><div class="k" id="kStart"></div><div class="v" id="startDate">&mdash;</div></div>
    <div class="meta-item"><div class="k" id="kTime"></div><div class="v" id="timeVal"></div></div>
    <div class="meta-item"><div class="k" id="kEnd"></div><div class="v" id="endDate">&mdash;</div></div>
  </div>

  <button id="addBtn" type="button"></button>
  <div class="status" id="status" aria-live="polite"></div>
  <div class="foot" id="foot"></div>
</div>

<script>
  const DAYS = 14;
  const HOUR = 21; // 9:00 PM
  const DURATION_HOURS = 1;

  const T = {
    en: {
      locale: 'en-GB',
      eyebrow: 'Two-week check-in',
      h1a: 'Resilient Activism', h1b: 'Reminder',
      lede: 'Click below and this creates fourteen calendar events, one every night at 9:00\u00A0PM, starting today.',
      titleLabel: 'Event name',
      eventTitle: 'Evening check-in',
      kStart: 'Starts', kTime: 'Time', kEnd: 'Ends', time: '9:00 PM',
      btn: 'Add to calendar',
      foot: 'Downloads a single .ics file. Open it and your calendar app (Google, Apple, Outlook) will import all fourteen reminders at once.',
      desc: n => 'Nightly 9 PM check-in, ' + n + ' nights.',
      saved: n => 'Saved. Open the downloaded file to add all ' + n + ' events.',
      every: 'every night at 9:00 PM'
    },
    nl: {
      locale: 'nl-NL',
      eyebrow: 'Check-in van twee weken',
      h1a: 'Duurzaam Activisme', h1b: 'Herinnering',
      lede: 'Klik hieronder om veertien afspraken in de agenda aan te maken, voor elke avond om 21.00 uur, te beginnen met vandaag.',
      titleLabel: 'Naam van de afspraak',
      eventTitle: 'Avondenquête Duurzaam Activisme',
      kStart: 'Start', kTime: 'Tijd', kEnd: 'Einde', time: '21:00',
      btn: 'Toevoegen aan agenda',
      foot: 'Hiermee download je één .ics-bestand. Open het bestand en je agenda-app (Google, Apple, Outlook) importeert alle veertien herinneringen in één keer.',
      desc: n => 'Dagelijkse enquête om 21.00 uur, ' + n + ' avonden.',
      saved: n => 'Opgeslagen. Open het gedownloade bestand om alle ' + n + ' afspraken toe te voegen.',
      every: 'elke avond om 21.00 uur'
    },
    de: {
      locale: 'de-DE',
      eyebrow: 'Zwei-Wochen-Check-in',
      h1a: 'Resilienter Aktivismus', h1b: 'Erinnerung',
      lede: 'Klicke unten, um vierzehn Kalendertermine zu erstellen, jeweils abends um 21:00 Uhr, beginnend mit dem heutigen Tag.',
      titleLabel: 'Name des Termins',
      eventTitle: 'Abendlicher Fragebogen zu Engagement & Emotionen',
      kStart: 'Beginn', kTime: 'Uhrzeit', kEnd: 'Ende', time: '21:00 Uhr',
      btn: 'Zum Kalender hinzuf\u00FCgen',
      foot: 'Damit l\u00E4dst du eine einzige .ics-Datei herunter. \u00D6ffne die Datei, und deine Kalender-App (Google, Apple, Outlook) importiert alle vierzehn Erinnerungen auf einmal.',
      desc: n => 'T\u00E4glicher Fragebogen um 21:00 Uhr, ' + n + ' Abende.',
      saved: n => 'Gespeichert. \u00D6ffne die heruntergeladene Datei, um alle ' + n + ' Termine hinzuzuf\u00FCgen.',
      every: 'jeden Abend um 21:00 Uhr'
    }
  };

  function pad(n){ return String(n).padStart(2,'0'); }
  function fmtLocal(d){ return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00'; }
  function fmtUTCStamp(d){ return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+pad(d.getUTCMinutes())+pad(d.getUTCSeconds())+'Z'; }
  function icsEscape(s){ return s.replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n'); }

  const today = new Date();
  const start = new Date(today.getFullYear(), today.getMonth(), today.getDate(), HOUR, 0, 0);
  const end = new Date(start.getTime() + DURATION_HOURS*3600*1000);
  const last = new Date(today.getFullYear(), today.getMonth(), today.getDate() + DAYS - 1, HOUR, 0, 0);

  const arc = document.getElementById('arc');
  for (let i=0;i<DAYS;i++) arc.appendChild(document.createElement('span'));

  const $ = id => document.getElementById(id);
  let lang = 'en';
  let titleEdited = false;

  $('title').addEventListener('input', () => { titleEdited = true; });

  function niceDate(d){ return d.toLocaleDateString(T[lang].locale, {weekday:'short', month:'short', day:'numeric'}); }

  function setLang(code){
    const prev = T[lang];
    lang = code;
    const t = T[lang];
    document.documentElement.lang = code;
    $('eyebrow').textContent = t.eyebrow;
    $('h1a').textContent = t.h1a;
    $('h1b').textContent = t.h1b;
    $('lede').textContent = t.lede;
    $('titleLabel').textContent = t.titleLabel;
    $('kStart').textContent = t.kStart;
    $('kTime').textContent = t.kTime;
    $('kEnd').textContent = t.kEnd;
    $('timeVal').textContent = t.time;
    $('addBtn').textContent = t.btn;
    $('foot').textContent = t.foot;
    $('startDate').textContent = niceDate(start);
    $('endDate').textContent = niceDate(last);
    // swap the event name to the new language unless the user typed their own
    if (!titleEdited || $('title').value === prev.eventTitle) {
      $('title').value = t.eventTitle;
      titleEdited = false;
    }
    document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === code));
    $('status').classList.remove('show');
    try { localStorage.setItem('lang', code); } catch(e){}
  }

  document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));

  // Initial language: URL (?lang=nl) > saved choice > browser language > English
  (function init(){
    let code = new URLSearchParams(location.search).get('lang');
    if (!T[code]) { try { code = localStorage.getItem('lang'); } catch(e){} }
    if (!T[code]) code = (navigator.language || 'en').slice(0,2).toLowerCase();
    setLang(T[code] ? code : 'en');
  })();

  $('addBtn').addEventListener('click', function(){
    const t = T[lang];
    const title = $('title').value.trim() || t.eventTitle;
    const ics = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//Daily Check-in Link//EN',
      'CALSCALE:GREGORIAN',
      'BEGIN:VEVENT',
      'UID:checkin-' + Date.now() + '@personal',
      'DTSTAMP:' + fmtUTCStamp(new Date()),
      'DTSTART:' + fmtLocal(start),
      'DTEND:' + fmtLocal(end),
      'RRULE:FREQ=DAILY;COUNT=' + DAYS,
      'SUMMARY:' + icsEscape(title),
      'DESCRIPTION:' + icsEscape(t.desc(DAYS)),
      'END:VEVENT',
      'END:VCALENDAR'
    ].join('\r\n');

    const blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'daily-checkin.ics';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);

    document.querySelectorAll('#arc span').forEach(s => s.style.background = 'var(--amber)');
    const status = $('status');
    status.classList.add('show');
    status.innerHTML = t.saved(DAYS) + '<div class="dates">' + niceDate(start) + ' \u2192 ' + niceDate(last) + ', ' + t.every + '</div>';
  });
</script>
</body>
</html>
